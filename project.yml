name: Blink
options:
  bundleIdPrefix: com.blink
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.4"
  groupSortPosition: top
packages:
  VKCaptchaSDK:
    url: https://github.com/VKCOM/vkid-captcha-ios-sdk
    revision: 95ba7944a79da5e85b064d47833be4426fb763ee
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.3"
    CURRENT_PROJECT_VERSION: 1
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_BITCODE: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    APP_GROUP_ID: group.com.blink.tunnel
    KEYCHAIN_GROUP_ID: $(AppIdentifierPrefix)com.blink.tunnel.shared
configs:
  Debug: debug
  Release: release
targets:
  Blink:
    type: application
    platform: iOS
    sources:
      - path: Blink
        excludes:
          - NetworkExtension
          - XrayExtension
      - path: Blink/XrayExtension/XraySocketProtector.swift
    dependencies:
      - framework: Native/dist/BlinkCore.xcframework
        embed: false
      - sdk: libresolv.tbd
      - package: VKCaptchaSDK
        product: VKCaptchaSDK
      - target: BlinkXrayTunnel
        embed: true
    entitlements:
      path: Blink/Config/Blink.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
        keychain-access-groups:
          - $(KEYCHAIN_GROUP_ID)
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blink.tunnel
        PRODUCT_NAME: Blink
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Blink
        INFOPLIST_KEY_NSCameraUsageDescription: Камера нужна для сканирования QR-кода VPN-подписки или конфигурации.
        INFOPLIST_KEY_BlinkKeychainAccessGroup: $(KEYCHAIN_GROUP_ID)
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        INFOPLIST_KEY_UIStatusBarHidden: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - BlinkTests

  BlinkXrayTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Blink/XrayExtension
      - path: Blink/Diagnostics
      - path: Blink/Models/XrayProfile.swift
      - path: Blink/Models/UniversalProfile.swift
      - path: Blink/Models/SharedConstants.swift
      - path: Blink/Storage/SecretStore.swift
      - path: Blink/Storage/NativeResources.swift
    dependencies:
      - framework: Native/dist/BlinkCore.xcframework
        embed: false
      - sdk: libresolv.tbd
    entitlements:
      path: Blink/Config/BlinkXrayTunnel.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
        keychain-access-groups:
          - $(KEYCHAIN_GROUP_ID)
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    info:
      path: Blink/XrayExtension/Info.plist
      properties:
        CFBundleDisplayName: Blink Xray
        BlinkKeychainAccessGroup: $(KEYCHAIN_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).XrayPacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blink.tunnel.XrayTunnel
        PRODUCT_NAME: BlinkXrayTunnel
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  BlinkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BlinkTests
      - path: fixtures
        buildPhase: resources
    dependencies:
      - target: Blink
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blink.tunnel.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
